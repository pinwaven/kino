<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="80" fill="none" stroke="#333" stroke-width="2" />
  <circle r="15" fill="#00FF00">
    <animate attributeName="cx" values="20;180;20" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;100;100" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
